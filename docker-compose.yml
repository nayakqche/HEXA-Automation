services:
  hexa-agent:
    build: .
    image: hexa-connectivity-agent:latest
    container_name: hexa-connectivity-agent
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    # The default CMD runs the Flask dashboard + embedded scheduler on
    # http://localhost:5000. To run the headless CLI scheduler instead,
    # uncomment the line below:
    # command: ["python", "main.py", "schedule"]
